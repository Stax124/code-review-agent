[package]
name = "code-review-agent"
version = "0.6.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
color-eyre = "0.6.5"
colored = "3.1.1"
dotenvy = "0.15.7"
grep = "0.4.1"
ignore = "0.4.33"
indexmap = "2.14.0"
reqwest = { version = "0.13.4", features = ["json"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
